databases:
  - name: visit-yaounde-db
    databaseName: visit_yaounde
    plan: free

services:
  - type: web
    name: visit-yaounde-backend
    runtime: docker
    dockerfilePath: ./legacy-monolith/backend/Dockerfile
    dockerContext: ./legacy-monolith/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: visit-yaounde-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CLOUDINARY_URL
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: CLIENT_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: SEED_ADMIN_EMAIL
        value: admin@visityaounde.cm
      - key: SEED_ADMIN_PASSWORD
        sync: false
