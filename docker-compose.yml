services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visit_yaounde
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/visit_yaounde?schema=auth
      GATEWAY_URL: http://gateway:4000
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy

  attractions-service:
    build:
      context: ./services/attractions-service
    restart: unless-stopped
    env_file:
      - ./services/attractions-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/visit_yaounde?schema=attractions
      GATEWAY_URL: http://gateway:4000
    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attractions_uploads:/app/uploads

  engagement-service:
    build:
      context: ./services/engagement-service
    restart: unless-stopped
    env_file:
      - ./services/engagement-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/visit_yaounde?schema=engagement
      GATEWAY_URL: http://gateway:4000
      ATTRACTIONS_SERVICE_URL: http://attractions-service:4002
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      attractions-service:
        condition: service_started

  gateway:
    build:
      context: ./services/gateway
    restart: unless-stopped
    env_file:
      - ./services/gateway/.env
    environment:
      CLIENT_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://auth-service:4001
      ATTRACTIONS_SERVICE_URL: http://attractions-service:4002
      ENGAGEMENT_SERVICE_URL: http://engagement-service:4003
    ports:
      - '4000:4000'
    depends_on:
      - auth-service
      - attractions-service
      - engagement-service

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  attractions_uploads:
